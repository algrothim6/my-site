<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dfa4"/>
      <stop offset=".55" stop-color="#c8ac74"/>
      <stop offset="1" stop-color="#a5864c"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C7 -10 20 -13 30 -8 C22 2 10 6 0 0 Z" fill="url(#g)" fill-opacity=".85" stroke="#a5864c" stroke-width=".7"/>
      <path d="M2 -1 L26 -7" stroke="#7d6538" stroke-width=".6"/>
    </g>
  </defs>

  <!-- laurel wreath -->
  <g>
    <path d="M200 366 C118 352 58 292 52 206 C48 150 68 108 102 78" stroke="url(#g)" stroke-width="2"/>
    <path d="M200 366 C282 352 342 292 348 206 C352 150 332 108 298 78" stroke="url(#g)" stroke-width="2"/>
    <g id="leaves-left">
      <use href="#leaf" transform="translate(70 310) rotate(40)"/>
      <use href="#leaf" transform="translate(58 280) rotate(20)"/>
      <use href="#leaf" transform="translate(50 245) rotate(2)"/>
      <use href="#leaf" transform="translate(50 210) rotate(-16)"/>
      <use href="#leaf" transform="translate(56 178) rotate(-34)"/>
      <use href="#leaf" transform="translate(68 148) rotate(-52)"/>
      <use href="#leaf" transform="translate(86 122) rotate(-70)"/>
      <use href="#leaf" transform="translate(108 100) rotate(-88)"/>
      <use href="#leaf" transform="translate(88 292) rotate(108)"/>
      <use href="#leaf" transform="translate(72 258) rotate(88)"/>
      <use href="#leaf" transform="translate(64 224) rotate(70)"/>
      <use href="#leaf" transform="translate(66 190) rotate(52)"/>
      <use href="#leaf" transform="translate(76 158) rotate(34)"/>
      <use href="#leaf" transform="translate(94 130) rotate(16)"/>
    </g>
    <g transform="translate(400 0) scale(-1 1)">
      <use href="#leaves-left"/>
    </g>
  </g>

  <!-- eagle wings -->
  <g stroke="url(#g)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M188 148 C160 118 118 100 74 104 C96 118 110 132 118 148 C92 140 68 142 48 152 C78 160 102 172 120 190 C146 172 168 158 188 148 Z" fill="url(#g)" fill-opacity=".22"/>
    <path d="M212 148 C240 118 282 100 326 104 C304 118 290 132 282 148 C308 140 332 142 352 152 C322 160 298 172 280 190 C254 172 232 158 212 148 Z" fill="url(#g)" fill-opacity=".22"/>
    <path d="M100 126 L150 152 M84 142 L140 166 M74 158 L130 180 M300 126 L250 152 M316 142 L260 166 M326 158 L270 180" stroke-opacity=".75"/>
  </g>

  <!-- body / tail -->
  <g fill="url(#g)" fill-opacity=".28" stroke="url(#g)" stroke-width="1.5">
    <path d="M200 150 C184 158 176 178 178 206 L200 300 L222 206 C224 178 216 158 200 150 Z"/>
    <path d="M186 288 L200 336 L214 288 Z"/>
    <path d="M176 282 L186 326 L194 284 Z" fill-opacity=".2"/>
    <path d="M224 282 L214 326 L206 284 Z" fill-opacity=".2"/>
  </g>

  <!-- head -->
  <g fill="url(#g)" fill-opacity=".4" stroke="url(#g)" stroke-width="1.4">
    <path d="M200 104 C184 104 174 116 176 130 C178 144 188 152 200 152 C212 152 222 144 224 130 C226 116 216 104 200 104 Z"/>
    <path d="M176 122 L160 128 L176 134 Z"/>
    <path d="M193 112 C198 108 205 108 210 112" stroke-width="1"/>
  </g>
  <circle cx="188" cy="124" r="2.6" fill="#060f0b"/>

  <!-- shield with crescent and star -->
  <g>
    <path d="M200 168 L228 178 L224 220 C220 244 208 256 200 262 C192 256 180 244 176 220 L172 178 Z" fill="#0a1510" fill-opacity=".85" stroke="url(#g)" stroke-width="2.4"/>
    <path d="M206 194 A17 17 0 1 0 206 226 A13 13 0 1 1 206 194 Z" fill="url(#g)"/>
    <path d="M214 200 L217 208 L226 208 L219 214 L222 223 L214 218 L206 223 L209 214 L202 208 L211 208 Z" fill="url(#g)"/>
  </g>

  <!-- wreath tie -->
  <g stroke="url(#g)" stroke-width="2">
    <path d="M180 362 Q200 374 220 362 M182 370 Q200 382 218 370"/>
    <path d="M196 358 L204 374 M204 358 L196 374" stroke-width="1.4"/>
  </g>
</svg>
